# database
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:bee_shoes_db}
spring.datasource.username=${DB_USERNAME:bee_user}
spring.datasource.password=${DB_PASSWORD:strongpassword}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.sql-script-encoding=UTF-8
spring.jpa.properties.hibernate.globally_quoted_i/dentifiers=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# cloudinary
cloudinary.cloud-name=${CLOUD_NAME:username}
cloudinary.api-key=${CLOUD_API:apikey}
cloudinary.api-secret=${CLOUD_SECRET:secret}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# email
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:beeshoes@gmail.com}
spring.mail.password=${MAIL_PASSWORD:password}
spring.mail.properties.mail.transport.protocol=TLSv1.2
spring.mail.properties.mail.smtp.port=25
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

# config
domain.client=${DOMAIN_CLIENT:http://beeshoes.website}
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh

# excel
jxls.template.path= classpath:jxls/
jxls.template.output.path= classpath:output/
spring.jpa.properties.hibernate.jdbc.batch_size=2000
spring.jpa.properties.hibernate.order_inserts=true
apiVersion: v1
kind: Service
metadata:
  namespace: {{ .Values.namespace }}
  name: {{ .Chart.Name }}-service
  labels:
    {{- include "beeshoes.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "beeshoes.selectorLabels" . | nindent 4 }}
  ports:
  - protocol: TCP
    port: {{ .Values.service.port }}
    targetPort: {{ .Values.service.targetPort }}

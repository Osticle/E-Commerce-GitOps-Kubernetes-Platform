image:
  repository: sugm4d1c/beeshoes-be
  tag: "branch_hash_version"            # pipeline will overwrite it in each build
  pullPolicy: IfNotPresent

imagePullSecrets: []      

replicaCount: 1            # only work when autoscaling.enabled = false

service:
  port: 8080
  targetPort: 8080

ingress:
  enabled: true
  className: nginx
  host: api-beeshoes.website

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70

resources:
  requests:
    memory: "256Mi"
    cpu: "150m"
  limits:
    memory: "512Mi"

config:
  DB_HOST: "192.168.219.41"
  DB_PORT: "3306"
  DB_NAME: "bee_shoes_db"

secret:
  DB_USERNAME: "bee_user"
  DB_PASSWORD: "strongpassword"
